services:
  cudl-search:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cudl-search
    environment:
      SOLR_HOST: ${SOLR_HOST:-host.docker.internal}
      SOLR_PORT: ${SOLR_PORT:-8983}
      API_PORT: ${API_PORT:-80}
      ENABLE_ORPHAN_PAGE_PRUNE: ${ENABLE_ORPHAN_PAGE_PRUNE:-false}
      NUM_WORKERS: 5
    ports:
      - ${API_PORT}:${API_PORT}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 512M
